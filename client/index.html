<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LinkWork — Every posting here is real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Anti-flash theme resolution. Must run before React mounts, or the page
         paints light and then flips. Kept in sync with useTheme() in App.jsx:
         both resolve 'system' against prefers-color-scheme and write the same
         data-theme attribute. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('linkwork-theme') || 'system';
          var d = t === 'dark' || (t === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
